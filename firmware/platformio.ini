[platformio]
default_envs = az_delivery_devkit_v4_foundation

[env:az_delivery_devkit_v4_foundation]
extra_scripts = pre:scripts/build_metadata.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = az-delivery-devkit-v4
framework = espidf, arduino

; The firmware already exceeds the 1 MB single-app partition. Use two
; 0x1E0000-byte application slots so USB and OTA updates share one layout.
board_build.partitions = partitions.csv

; Required by the combined ESP-IDF/Arduino build. These managed components
; register their certificates with CMake; listing them here also makes the
; PlatformIO/SCons dependency graph generate the embedded assembly sources.
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_unflags = -Werror=reorder
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D USE_ESP_IDF_LOG
    -D FIRMWARE_VERSION='"0.2.0-beta.2"'

lib_ldf_mode = deep
lib_deps =
    https://github.com/SignalK/SensESP.git#d3e8a6fda56c5be866be7a21fe288a5e31144dfa
    https://github.com/dirkwa/sensesp-ble-gateway.git#ae35180d0d1f2cb6d043366a324c5b8320c001eb
    esp_websocket_client=https://components.espressif.com/api/downloads/?object_type=component&object_id=dbc87006-9a4b-45e6-a6ab-b286174cb413

; Enable OTA through a dedicated local environment after the initial USB flash.
; This keeps the standard build independent of a device-specific IP address.
[env:az_delivery_devkit_v4_foundation_ota]
extends = env:az_delivery_devkit_v4_foundation
upload_protocol = espota
upload_port = ${sysenv.GATEWAY_OTA_HOST}
upload_flags =
    --auth=${sysenv.GATEWAY_OTA_PASSWORD}
